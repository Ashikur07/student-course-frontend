<div class="flex h-screen overflow-hidden bg-slate-50 text-slate-800">
  <!-- Mobile Sidebar Backdrop Overlay -->
  @if (layoutService.sidebarOpen()) {
    <div
      (click)="layoutService.closeSidebar()"
      class="fixed inset-0 bg-slate-950/50 backdrop-blur-xs z-40 md:hidden transition-opacity duration-200"
      aria-hidden="true"
    ></div>
  }

  <!-- Sidebar Component (Desktop: Static left sidebar, Mobile: Off-canvas slide drawer) -->
  <app-sidebar
    class="fixed inset-y-0 left-0 z-50 transition-transform duration-300 ease-in-out md:static md:translate-x-0 shrink-0"
    [class.max-md:-translate-x-full]="!layoutService.sidebarOpen()"
    [class.max-md:translate-x-0]="layoutService.sidebarOpen()"
  />

  <!-- Right Main Area -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-slate-50">
    <!-- Top Header / Navbar -->
    <app-navbar class="shrink-0" />

    <!-- Main Dynamic Content (Scrollable) -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
      <div class="max-w-7xl mx-auto w-full pb-12">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<!-- Global Toast Notifications -->
<div class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
  @for (toast of notificationService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-center justify-between gap-3 px-4 py-3.5 rounded-2xl shadow-xl border text-sm font-medium backdrop-blur-md transition-all transform duration-200"
      [class]="
        toast.type === 'success'
          ? 'bg-emerald-600 text-white border-emerald-500 shadow-emerald-950/20'
          : toast.type === 'error'
          ? 'bg-rose-600 text-white border-rose-500 shadow-rose-950/20'
          : 'bg-slate-900 text-white border-slate-700 shadow-slate-950/25'
      "
    >
      <div class="flex items-center gap-2.5 min-w-0">
        @if (toast.type === 'success') {
          <svg class="w-5 h-5 shrink-0 text-emerald-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        } @else if (toast.type === 'error') {
          <svg class="w-5 h-5 shrink-0 text-rose-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        } @else {
          <svg class="w-5 h-5 shrink-0 text-indigo-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        <span class="truncate">{{ toast.message }}</span>
      </div>
      <button
        (click)="notificationService.removeToast(toast.id)"
        class="text-white/70 hover:text-white p-1 rounded-lg hover:bg-white/10 transition cursor-pointer shrink-0"
        aria-label="Close notification"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
