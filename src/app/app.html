<div class="flex h-screen overflow-hidden bg-slate-50 text-slate-800">
  <!-- Left Sidebar (Fixed Height) -->
  <app-sidebar class="shrink-0" />

  <!-- Right Main Content Area (Only this part scrolls) -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    <app-navbar class="shrink-0" />

    <main class="flex-1 p-6 md:p-8 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>

<!-- Global Toast Notifications -->
<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  @for (toast of notificationService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition-all"
      [class]="
        toast.type === 'success'
          ? 'bg-emerald-600 text-white border-emerald-700'
          : toast.type === 'error'
          ? 'bg-rose-600 text-white border-rose-700'
          : 'bg-slate-800 text-white border-slate-700'
      "
    >
      <span>{{ toast.message }}</span>
      <button
        (click)="notificationService.removeToast(toast.id)"
        class="text-white/80 hover:text-white font-bold cursor-pointer"
      >
        ✕
      </button>
    </div>
  }
</div>
