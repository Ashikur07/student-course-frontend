@if (isOpen()) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
      <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100 animate-in fade-in zoom-in-95 duration-150">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-lg font-bold">
            !
          </div>
          <h3 class="text-lg font-bold text-slate-800">{{ title() }}</h3>
        </div>
  
        <p class="mt-3 text-sm text-slate-600 leading-relaxed">
          {{ message() }}
        </p>
  
        <div class="mt-6 flex items-center justify-end gap-3">
          <button
            type="button"
            (click)="cancel.emit()"
            class="px-4 py-2 rounded-xl text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 transition cursor-pointer"
          >
            Cancel
          </button>
          <button
            type="button"
            (click)="confirm.emit()"
            class="px-4 py-2 rounded-xl text-sm font-medium text-white bg-rose-600 hover:bg-rose-700 shadow-sm transition cursor-pointer"
          >
            Yes, Delete
          </button>
        </div>
      </div>
    </div>
  }
