@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
    <div
      class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 sm:p-7 border border-slate-100 transform transition-all animate-in zoom-in-95 duration-200"
      role="dialog"
      aria-modal="true"
    >
      <div class="flex items-start gap-4">
        <div class="w-12 h-12 rounded-2xl bg-rose-50 border border-rose-100 text-rose-600 flex items-center justify-center shrink-0 shadow-xs">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </div>
        <div class="flex-1">
          <h3 class="text-lg font-bold text-slate-900 leading-snug">{{ title() }}</h3>
          <p class="mt-2 text-sm text-slate-500 leading-relaxed">
            {{ message() }}
          </p>
        </div>
      </div>

      <div class="mt-7 flex flex-col-reverse sm:flex-row items-center justify-end gap-2.5 sm:gap-3">
        <button
          type="button"
          (click)="cancel.emit()"
          class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition cursor-pointer"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="confirm.emit()"
          class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-700 hover:to-rose-800 shadow-md shadow-rose-600/25 transition cursor-pointer"
        >
          Yes, Delete Record
        </button>
      </div>
    </div>
  </div>
}
