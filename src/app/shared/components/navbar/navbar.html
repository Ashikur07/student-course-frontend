<header class="h-18 bg-white border-b border-slate-200/90 px-4 sm:px-6 lg:px-8 flex items-center justify-between sticky top-0 z-30 shadow-2xs">
  <!-- Left Side: Mobile Menu Button & Title -->
  <div class="flex items-center gap-3 sm:gap-4">
    <!-- Hamburger button for mobile drawer -->
    <button
      (click)="layoutService.toggleSidebar()"
      class="md:hidden p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition cursor-pointer"
      aria-label="Toggle navigation menu"
    >
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div>
      <div class="flex items-center gap-2">
        <h2 class="text-base sm:text-lg font-extrabold text-slate-900 tracking-tight">
          Academic Management System
        </h2>
      </div>
      <p class="hidden sm:block text-xs text-slate-500 mt-0.5">
        Centralized Student, Course & Enrollment Administration
      </p>
    </div>
  </div>

  <!-- Right Side: Admin Profile -->
  <div class="flex items-center gap-3">
    <div class="text-right hidden sm:block">
      <p class="text-sm font-bold text-slate-900 leading-tight">Admin Portal</p>
      <p class="text-[11px] font-medium text-slate-400">Super Administrator</p>
    </div>

    <div class="relative">
      <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-600 text-white font-bold flex items-center justify-center shadow-sm text-sm">
        A
      </div>
      <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white"></span>
    </div>
  </div>
</header>
