<div class="flex flex-col sm:flex-row items-center justify-between gap-4 px-4 sm:px-6 py-4 bg-white border-t border-slate-100 text-sm">
  <!-- Showing Info & Page Size Selector -->
  <div class="flex flex-wrap items-center justify-between sm:justify-start w-full sm:w-auto gap-3 text-slate-600 text-xs sm:text-sm">
    <span>
      Showing <strong class="text-slate-800 font-semibold">{{ startItem() }}</strong> -
      <strong class="text-slate-800 font-semibold">{{ endItem() }}</strong> of
      <strong class="text-slate-800 font-semibold">{{ totalElements() }}</strong>
    </span>

    <div class="flex items-center gap-1.5">
      <label class="text-xs text-slate-400 hidden xs:inline">Rows:</label>
      <select
        (change)="onSizeSelect($event)"
        class="border border-slate-200 rounded-lg px-2.5 py-1 text-xs font-semibold text-slate-700 bg-slate-50 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 cursor-pointer transition"
      >
        @for (size of [5, 10, 20, 50]; track size) {
          <option [value]="size" [selected]="pageSize() === size">{{ size }} / page</option>
        }
      </select>
    </div>
  </div>

  <!-- Page Navigation Controls -->
  @if (totalPages() > 1) {
    <div class="flex items-center justify-between w-full sm:w-auto gap-2">
      <!-- Mobile Compact Page Indicator -->
      <span class="sm:hidden text-xs font-medium text-slate-500">
        Page {{ currentPage() + 1 }} of {{ totalPages() }}
      </span>

      <div class="flex items-center gap-1.5 ml-auto sm:ml-0">
        <!-- Prev Button -->
        <button
          (click)="onPageSelect(currentPage() - 1)"
          [disabled]="currentPage() === 0"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 disabled:opacity-40 disabled:pointer-events-none cursor-pointer transition shadow-2xs"
        >
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          <span class="hidden xs:inline">Prev</span>
        </button>

        <!-- Desktop Numbered Buttons -->
        <div class="hidden sm:flex items-center gap-1">
          @for (page of pages(); track page) {
            <button
              (click)="onPageSelect(page)"
              class="w-8 h-8 rounded-lg text-xs font-semibold transition cursor-pointer"
              [class]="
                page === currentPage()
                  ? 'bg-gradient-to-r from-indigo-600 to-indigo-500 text-white shadow-sm shadow-indigo-600/30'
                  : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900 border border-transparent'
              "
            >
              {{ page + 1 }}
            </button>
          }
        </div>

        <!-- Next Button -->
        <button
          (click)="onPageSelect(currentPage() + 1)"
          [disabled]="currentPage() >= totalPages() - 1"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 disabled:opacity-40 disabled:pointer-events-none cursor-pointer transition shadow-2xs"
        >
          <span class="hidden xs:inline">Next</span>
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
  }
</div>
