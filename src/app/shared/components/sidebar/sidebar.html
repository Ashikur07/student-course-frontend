<aside class="w-64 bg-slate-900 text-white h-screen overflow-y-auto flex flex-col shadow-xl select-none">
    <!-- Brand Logo -->
    <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-800">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-lg shadow">
        S
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide text-white leading-none">EduManage</h1>
        <span class="text-[11px] text-slate-400">Student-Course Portal</span>
      </div>
    </div>
  
    <!-- Navigation Links -->
    <nav class="flex-1 px-4 py-6 space-y-1.5">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-indigo-600 text-white shadow-md shadow-indigo-600/30"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-all duration-150"
        >
          <span class="text-lg">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  
    <!-- Footer Info -->
    <div class="p-4 m-4 rounded-xl bg-slate-800/60 border border-slate-700/50 text-xs text-slate-400">
      <p class="font-semibold text-slate-200">System Status</p>
      <div class="flex items-center gap-2 mt-1">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Spring Boot API Connected</span>
      </div>
    </div>
  </aside>
